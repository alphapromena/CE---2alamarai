# Supabase local development config.
# Linked to a hosted project via `supabase link --project-ref $SUPABASE_PROJECT_REF`.
# Real schema, RLS, and Edge Functions are added in Phases 1+.

project_id = "promoter-monitoring"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"

[auth.external.email]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Per-function config. verify_jwt = true is the default but making it explicit
# prevents a future config change from accidentally flipping the trust model.
[functions.geo-validate-checkin]
verify_jwt = true

[functions.geo-validate-checkout]
verify_jwt = true

[functions.supervisor-visit-create]
verify_jwt = true

# Cron-invoked sweep: no user session, so JWT verification is off. The
# function validates an x-cron-secret header instead. CRON_SECRET must be set
# as a Supabase function secret before deploy.
[functions.detect-attendance-issues]
verify_jwt = false

# compute-kpis has two modes: targeted (invoked from Server Actions) and
# sweep (cron). verify_jwt = true is correct for the targeted mode; the
# sweep also requires a bearer token (use the service-role key when
# scheduling) and is further gated by an x-cron-secret header checked in
# the function body.
[functions.compute-kpis]
verify_jwt = true

# Phase 7 sweep (cron-invoked). Same trust model as detect-attendance-issues:
# no user session, CRON_SECRET enforced via x-cron-secret header in the
# function body.
[functions.detect-live-issues]
verify_jwt = false

# Phase 8 export worker. Cron-invoked by cron-scheduled-reports with a
# { job_id } body; can also be swept standalone with an empty body.
# CRON_SECRET enforced via x-cron-secret header in the function body.
[functions.generate-report]
verify_jwt = false

# Phase 8 scheduled-reports sweep. Cron-invoked hourly; fires every due
# scheduled_reports row and calls generate-report for each.
[functions.cron-scheduled-reports]
verify_jwt = false

# Feature 4 photo-retention sweep. Nightly; removes attendance + visit photos
# older than 90 days. CRON_SECRET enforced via x-cron-secret header.
[functions.cleanup-old-photos]
verify_jwt = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
